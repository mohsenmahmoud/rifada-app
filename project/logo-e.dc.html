<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#F7F4EE;font-family:'Cairo',sans-serif} a{color:#1F3B57}</style>
</helmet>
<div dir="rtl" style="padding:26px;display:flex;flex-direction:column;gap:14px">
  <div style="background:linear-gradient(160deg,#27496F,#1F3B57);border-radius:24px;padding:54px 30px;display:flex;flex-direction:column;align-items:center;gap:22px">
    <svg width="120" height="120" viewBox="0 0 32 32" fill="none">
      <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#FFFFFF" stroke-width="3.4"></rect>
      <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#C79A3C" stroke-width="3.4" transform="rotate(45 16 16)"></rect>
      <circle cx="16" cy="16" r="2.2" fill="#FFFFFF"></circle>
    </svg>
    <span style="font-size:52px;font-weight:900;color:#fff;line-height:1.1">رفادة<span style="color:#C79A3C">.</span></span>
    <span style="font-size:12.5px;color:rgba(255,255,255,0.6)">نجمة ثمانية من مربعين متعانقين — الهندسة العربية بروح رقمية</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;gap:12px">
      <svg width="42" height="42" viewBox="0 0 32 32" fill="none">
        <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#1F3B57" stroke-width="3.4"></rect>
        <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#C79A3C" stroke-width="3.4" transform="rotate(45 16 16)"></rect>
        <circle cx="16" cy="16" r="2.2" fill="#1F3B57"></circle>
      </svg>
      <span style="font-size:30px;font-weight:900;color:#1F3B57;line-height:1">رفادة<span style="color:#C79A3C">.</span></span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#27496F,#1F3B57);display:flex;align-items:center;justify-content:center">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#FFFFFF" stroke-width="3.4"></rect>
          <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#C79A3C" stroke-width="3.4" transform="rotate(45 16 16)"></rect>
          <circle cx="16" cy="16" r="2.2" fill="#FFFFFF"></circle>
        </svg>
      </span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <svg width="46" height="46" viewBox="0 0 32 32" fill="none">
        <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#1F3B57" stroke-width="3.4"></rect>
        <rect x="8" y="8" width="16" height="16" rx="3.5" stroke="#1F3B57" stroke-width="3.4" opacity="0.35" transform="rotate(45 16 16)"></rect>
        <circle cx="16" cy="16" r="2.2" fill="#1F3B57"></circle>
      </svg>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520}}"></script>
</body>
</html>
