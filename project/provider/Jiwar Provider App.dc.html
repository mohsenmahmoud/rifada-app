<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#1F3B57">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1F3B57"/>
    <path d="M330 430L520 250l190 180" stroke="#3FA66B" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M490 560L680 380l190 180" stroke="#F7F4EE" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="470" y="620" width="260" height="26" rx="13" fill="#C79A3C"/>
  </svg>
</template>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E9E4D9;}
a{color:#1F3B57;}a:hover{color:#C79A3C;}
button{font-family:'Cairo',sans-serif;}
</style>
</helmet>

<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;font-family:'Cairo',sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #F3EFE6 0%, #E9E4D9 60%)">

  <div dir="rtl" style="width:100%;max-width:1560px;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:22px 30px 14px">
    <svg width="32" height="32" viewBox="0 0 48 48" fill="none"><path d="M8 27L21 14l13 13" stroke="#3FA66B" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"></path><path d="M17 36L30 23l13 13" stroke="#1F3B57" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"></path></svg>
    <div style="display:flex;flex-direction:column">
      <div style="font-size:18px;font-weight:900;color:#1F3B57;line-height:1.2">رفادة <span style="font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:600;color:#C79A3C;letter-spacing:2px">JIWAR</span></div>
      <div style="font-size:11.5px;color:#6B7280">تطبيق مقدم الخدمة — تجربة تفاعلية ومعرض شاشات</div>
    </div>
    <div style="flex:1"></div>
    <div style="background:rgba(63,166,107,0.13);color:#2E7D51;border-radius:999px;padding:8px 20px;font-size:12px;font-weight:800;white-space:nowrap">{{ screenCount }} شاشة</div>
    <div style="display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 12px rgba(0,0,0,0.06)">
      <button onClick="{{ setGallery }}" style="border:none;cursor:pointer;border-radius:999px;padding:9px 20px;font-size:12.5px;font-weight:800;white-space:nowrap;background:{{ vgBg }};color:{{ vgC }}">معرض الشاشات</button>
      <button onClick="{{ setLive }}" style="border:none;cursor:pointer;border-radius:999px;padding:9px 20px;font-size:12.5px;font-weight:800;white-space:nowrap;background:{{ vlBg }};color:{{ vlC }}">تجربة تفاعلية</button>
    </div>
  </div>

  <div dir="rtl" style="width:100%;max-width:1560px;box-sizing:border-box;padding:0 30px 6px">
    <div style="background:#fff;border-radius:16px;padding:12px 18px;box-shadow:0 2px 12px rgba(0,0,0,0.06);font-size:12px;color:#6B7280;line-height:1.7">الفني والمتجر — استقبال الطلبات بعدّاد رد، إثبات الإنجاز، دورة الإسكرو، وسحب الأرباح البنكي.</div>
  </div>

  <!-- ===== LIVE: provider ===== -->
  <sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}">
    <div style="padding:10px 0 60px">
      <dc-import name="Jiwar Provider" hint-size="440px,900px"></dc-import>
    </div>
  </sc-if>


  <!-- ===== GALLERY: provider ===== -->
  <sc-if value="{{ isGallery }}" hint-placeholder-val="{{ false }}">
    <div dir="rtl" style="width:100%;max-width:1560px;box-sizing:border-box;padding:6px 30px 70px">
      <sc-for list="{{ provGroups }}" as="g" hint-placeholder-count="2">
        <div style="margin-top:30px">
          <div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#1F3B57"><span style="width:8px;height:8px;border-radius:99px;background:#3FA66B"></span>{{ g.name }}</div>
          <div style="display:flex;flex-wrap:wrap;gap:18px;margin-top:12px">
            <sc-for list="{{ g.screens }}" as="s" hint-placeholder-count="4">
              <div style="width:236px;display:flex;flex-direction:column;gap:8px">
                <div style="display:flex;align-items:center;gap:8px;padding:0 2px">
                  <span style="font-family:'IBM Plex Sans',sans-serif;font-size:10.5px;font-weight:700;color:#2E7D51;letter-spacing:1px;flex:none">{{ s.id }}</span>
                  <span style="font-size:12.5px;font-weight:800;color:#1F3B57;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.t }}</span>
                </div>
                <div style="position:relative;width:236px;height:497px;border-radius:22px;overflow:hidden;background:#EDE9DF;box-shadow:0 2px 12px rgba(0,0,0,0.09)">
                  <div style="width:470px;height:1080px;transform:scale(0.502);transform-origin:top right;pointer-events:none;position:relative;top:-45px">
                    <dc-import name="Jiwar Provider" preview-screen="{{ s.key }}" hint-size="470px,1080px"></dc-import>
                  </div>
                  <button onClick="{{ setLive }}" title="افتحه تفاعليًا" style="position:absolute;inset:0;background:transparent;border:none;cursor:pointer;padding:0"></button>
                </div>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>


</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1200, &quot;height&quot;: 1000}}">
class Component extends DCLogic {
  state = { view: 'gallery', liveScreen: 'home', openAdminGroup: 0 };

  renderVals() {
    const st = this.state;
    const NAVY = '#1F3B57', SLATE = '#6B7280';
    const seg = on => (on ? NAVY : 'transparent');
    const segC = on => (on ? '#fff' : SLATE);

    const provDefs = [
      ['الفني — الدورة اليومية', [['P2','home','الرئيسية والتوفر'],['P4','job','تفاصيل المهمة والتنفيذ'],['P5','history','المحفظة والأرباح والسحب البنكي']]],
      ['المتجر — استقبال وتشغيل الطلبات', [['P9','storeHome','واجهة المتجر والمنيو'],['P10','storeOrders','طابور الطلبات وخروج الأوردر'],['P11','storePayout','أرباح المتجر بعد العمولة']]],
    ];

    const mk = (defs, jumpFn) => defs.map(d => ({
      name: d[0],
      screens: d[1].map(s => ({ id: s[0], key: s[1], t: s[2], go: jumpFn ? jumpFn(s[1]) : (() => this.setState({ view: 'live' })) })),
    }));
    const provGroups = mk(provDefs);

    const count = defs => defs.reduce((a, d) => a + d[1].length, 0);

    return {
      setGallery: () => this.setState({ view: 'gallery' }),
      setLive: () => this.setState({ view: 'live' }),
      vgBg: seg(st.view === 'gallery'), vgC: segC(st.view === 'gallery'),
      vlBg: seg(st.view === 'live'), vlC: segC(st.view === 'live'),
      screenCount: String(count(provDefs)),
      isGallery: st.view === 'gallery', isLive: st.view === 'live',
      provGroups,
    };
  }
}
</script>
</body>
</html>
