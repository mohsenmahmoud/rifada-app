<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#F7F4EE;font-family:'Cairo',sans-serif} a{color:#1F3B57}</style>
</helmet>
<div dir="rtl" style="padding:26px;display:flex;flex-direction:column;gap:14px">
  <div style="background:linear-gradient(160deg,#27496F,#1F3B57);border-radius:24px;padding:60px 30px;display:flex;flex-direction:column;align-items:center;gap:20px">
    <div style="display:flex;flex-direction:column;align-items:center">
      <span style="font-size:84px;font-weight:900;color:#fff;line-height:1.15">رفادة</span>
      <svg width="200" height="18" viewBox="0 0 200 18" fill="none">
        <path d="M6 12 C60 2 140 2 194 12" stroke="#C79A3C" stroke-width="6" stroke-linecap="round"></path>
      </svg>
    </div>
    <span style="font-size:12.5px;color:rgba(255,255,255,0.6)">الكلمة نفسها هي اللوجو — وتحتها قوس ذهبي كابتسامة/مظلة تجمع الجيران</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="display:flex;flex-direction:column;align-items:center">
        <span style="font-size:34px;font-weight:900;color:#1F3B57;line-height:1.2">رفادة</span>
        <svg width="82" height="10" viewBox="0 0 200 18" fill="none">
          <path d="M6 12 C60 2 140 2 194 12" stroke="#C79A3C" stroke-width="9" stroke-linecap="round"></path>
        </svg>
      </span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#27496F,#1F3B57);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
        <span style="font-size:22px;font-weight:900;color:#fff;line-height:1.1">رفادة</span>
        <svg width="40" height="7" viewBox="0 0 200 18" fill="none">
          <path d="M6 12 C60 2 140 2 194 12" stroke="#C79A3C" stroke-width="12" stroke-linecap="round"></path>
        </svg>
      </span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="display:flex;flex-direction:column;align-items:center;opacity:0.9">
        <span style="font-size:34px;font-weight:900;color:#1F3B57;line-height:1.2">رفادة</span>
        <svg width="82" height="10" viewBox="0 0 200 18" fill="none">
          <path d="M6 12 C60 2 140 2 194 12" stroke="#1F3B57" stroke-width="9" stroke-linecap="round" opacity="0.35"></path>
        </svg>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520}}"></script>
</body>
</html>
