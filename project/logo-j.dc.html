<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans:wght@600&display=swap" rel="stylesheet">
  <style>body{margin:0;background:#F7F4EE;font-family:'Cairo',sans-serif} a{color:#1F3B57}</style>
</helmet>
<div dir="rtl" style="padding:26px;display:flex;flex-direction:column;gap:14px">
  <div style="background:linear-gradient(160deg,#27496F,#1F3B57);border-radius:24px;padding:50px 30px;display:flex;flex-direction:column;align-items:center;gap:24px">
    <span style="width:120px;height:120px;border-radius:32px;background:#C79A3C;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 14px 34px rgba(0,0,0,0.25)">
      <span style="font-size:64px;font-weight:900;color:#1F3B57;line-height:1;margin-top:-10px">ج</span>
    </span>
    <span style="font-size:48px;font-weight:900;color:#fff;line-height:1.1">رفادة</span>
    <span style="font-size:12.5px;color:rgba(255,255,255,0.6)">مونوجرام «ج» — حرف جريء على ختم ذهبي، بسيط ولا يُنسى</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px">
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center;gap:12px">
      <span style="width:44px;height:44px;border-radius:13px;background:#C79A3C;display:flex;align-items:center;justify-content:center">
        <span style="font-size:24px;font-weight:900;color:#1F3B57;line-height:1;margin-top:-4px">ج</span>
      </span>
      <span style="font-size:30px;font-weight:900;color:#1F3B57;line-height:1">رفادة</span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="width:64px;height:64px;border-radius:18px;background:linear-gradient(160deg,#27496F,#1F3B57);display:flex;align-items:center;justify-content:center">
        <span style="font-size:34px;font-weight:900;color:#C79A3C;line-height:1;margin-top:-6px">ج</span>
      </span>
    </div>
    <div style="background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 12px rgba(0,0,0,0.06);display:flex;align-items:center;justify-content:center">
      <span style="width:56px;height:56px;border-radius:16px;background:rgba(31,59,87,0.08);display:flex;align-items:center;justify-content:center">
        <span style="font-size:30px;font-weight:900;color:#1F3B57;line-height:1;margin-top:-5px">ج</span>
      </span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520}}"></script>

</html>
